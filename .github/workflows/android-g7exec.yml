# .github/workflows/android-g7exec.yml
#
# The G7 EXECUTION build as an APK of its own (assembleG7exec): same package and signing key as the general app, so it installs OVER it and keeps the app's private files
# (ROM, ECID, IPSW). It adds libg7runner.so (host/g7_runner.c with -DHV_G7_REAL_EXECUTION: real disk creation, writable machine, the restore tool WITHOUT stop switches) and the
# only launcher of it (android/app/src/g7exec). The g7exec build type has the start switch OFF: this APK cannot start the runner. The g7start build type (same files, switch ON) is built and checked on every
# run, but PUBLISHED only by a manual run with publish_start=true (an explicitly approved run); a push never produces an installable switch-ON APK.
# The general APK workflow (android-apk.yml) never includes any of this and checks that it does not. See docs/g7-device-run.md.
name: Android G7 execution APK

on:
  workflow_dispatch:
    inputs:
      publish_start:
        description: "Publish the switch-ON G7 start APK (explicit approval only)"
        type: boolean
        default: false
  push:
    branches:
      - research/android-port
    paths:
      - android/app/src/g7exec/**
      - android/app/build.gradle
      # the runner is built from these too (virtual USB device, CPU core, host layer, third-party restore stack): a change in any of them must build and check this APK (a push never publishes)
      - devices/**
      - core/**
      - host/**
      - third_party/**
      - host/g7_*.c
      - host/g7_*.h
      - host/runner_g7_core.*
      - host/install.c
      - host/install_g7.*
      - host/net_guard.*
      - tools/g7-runner-build.sh
      - tools/restore-g7-build.sh
      - tools/check-g7exec-*.sh
      - tools/g7-watch-test.sh
      - tools/g7-mem-test.sh
      - tools/g7-diag-test.sh
      - tools/ui-runner-vm-clone-build.sh
      - tools/check-runner-vm-clone-safe.sh
      - tools/clone-dir-test.sh
      - tests/test_clone_dir.c
      - host/clone_dir.h
      - host/ui_runner_vm_clone.c
      - tests/test_g7_mem.c
      - tests/test_g7_diag.c
      - host/g7_diag.h
      - host/g7_mem.h
      - tests/test_g7_watch.c
      - tools/g7-tssdiag-test.sh
      - tests/test_g7_tssdiag.c
      - host/curl_last.h
      - host/curl_mbedtls.c
      - host/net_probe.c
      - tools/net-probe-test.sh
      - tests/test_net_probe.*
      - tests/java/G7NetProbeTest.java
      - tests/java/G7PipeReproTest.java
      - tests/java/android-stub/**
      - .github/workflows/android-g7exec.yml

env:
  NDK_VERSION: r27c

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android NDK
        run: |
          curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip -d "$HOME"
          echo "NDK_ROOT=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Source rules and launcher tests (plain JVM, fake processes; nothing is started)
        run: |
          bash -n tools/check-g7exec-launcher-source.sh tools/check-g7exec-apk.sh tools/check-g7exec-runner-stdout.sh tools/g7-watch-test.sh tools/g7-mem-test.sh tools/g7-diag-test.sh tools/g7-tssdiag-test.sh tools/net-probe-test.sh tools/clone-dir-test.sh tools/check-runner-vm-clone-safe.sh tools/ui-runner-vm-clone-build.sh
          tools/check-g7exec-launcher-source.sh
          tools/check-g7exec-runner-stdout.sh
          tools/g7-watch-test.sh
          tools/g7-mem-test.sh
          tools/g7-diag-test.sh
          tools/g7-tssdiag-test.sh
          tools/net-probe-test.sh build-netprobe-host
          tools/clone-dir-test.sh
          tools/g7-exec-launcher-test.sh build-g7exec-java
      - name: Build the engine objects, the restore stack WITHOUT stop switches, and the G7 execution runner (link; NOT run)
        run: |
          command -v cmake > /dev/null || sudo apt-get install -y -qq cmake > /dev/null
          T="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$T/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/engine-build.sh build-engine
          CC="$T/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/devices-build.sh build-engine
          CC="$T/aarch64-linux-android30-clang" EXTRA_LIBS="" tools/restore-g7-build.sh build-rs-g7
          tools/check-restore-g7-build.sh build-rs-g7
          CC="$T/aarch64-linux-android30-clang" NM="$T/llvm-nm" READELF="$T/llvm-readelf" EXTRA_LIBS="-llog" PF_THREADLIB="" tools/g7-runner-build.sh real build-g7exec build-engine build-rs-g7
          "$T/llvm-readelf" -h build-g7exec/g7_runner_real | grep -E "Class|Machine|Type"
          mkdir -p android/app/src/g7exec/jniLibs/arm64-v8a
          cp build-g7exec/g7_runner_real android/app/src/g7exec/jniLibs/arm64-v8a/libg7runner.so
          # the clone-boot runner (host/ui_runner_vm_clone.c): a normal boot of a verified CLONE, storage writable only there; a separate binary so the installed runner stays read-only. Link + static check, NOT run.
          CC="$T/aarch64-linux-android30-clang" NM="$T/llvm-nm" READELF="$T/llvm-readelf" EXTRA_LIBS="-llog" PF_THREADLIB="" tools/ui-runner-vm-clone-build.sh build-engine
          cp build-engine/ui_runner_vm_clone android/app/src/g7exec/jniLibs/arm64-v8a/libg7cloneboot.so
      - name: Build the network probe program (handshake only, no restore, no request body; link, NOT run)
        run: |
          T="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$T/aarch64-linux-android30-clang" CURLTOOL_LIBS="" tools/curltool-build.sh build-netprobe-arm
          TP=third_party
          "$T/aarch64-linux-android30-clang" -std=gnu11 -O2 -Wall -Wextra -Werror -Wno-unused-parameter -D_GNU_SOURCE -Ihost -c host/net_probe.c -o build-netprobe-arm/net_probe.o
          "$T/aarch64-linux-android30-clang" -std=gnu11 -O2 -w -D_GNU_SOURCE -Ihost -I$TP/curl_include -I$TP/mbedtls/include -c host/curl_mbedtls.c -o build-netprobe-arm/curl_ship.o
          "$T/aarch64-linux-android30-clang" -o build-netprobe-arm/net_probe build-netprobe-arm/net_probe.o build-netprobe-arm/curl_ship.o build-netprobe-arm/obj/*.o -lm
          "$T/llvm-readelf" -h build-netprobe-arm/net_probe | grep -E "Class|Machine|Type"
          cp build-netprobe-arm/net_probe android/app/src/g7exec/jniLibs/arm64-v8a/libnetprobe.so
      - name: Install SDK platform, build tools and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/probe.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/probe.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a temporary key (it cannot install over the general app)."
          fi
      - name: Version code (shared rule, tools/ci-version-code.sh)
        run: echo "HENGE_VERSION_CODE=$(tools/ci-version-code.sh)" >> "$GITHUB_ENV"
      - name: Build the G7 execution APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleG7exec --no-daemon --stacktrace
      - name: Build the G7 start APK (switch ON; built and checked every run, published only on request)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleG7start --no-daemon --stacktrace
      - name: Check the APK (runner present as AArch64, launcher present)
        run: |
          ls -l android/app/build/outputs/apk/g7exec/
          READELF="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" tools/check-g7exec-apk.sh exec android/app/build/outputs/apk/g7exec/app-g7exec.apk
          READELF="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" tools/check-g7exec-apk.sh start android/app/build/outputs/apk/g7start/app-g7start.apk
          echo "- G7 execution APK: built, launcher switch OFF (cannot start the runner), not run" >> "$GITHUB_STEP_SUMMARY"
          echo "- G7 start APK: built and checked (switch ON marker, runner as AArch64); published: ${{ inputs.publish_start == true }}" >> "$GITHUB_STEP_SUMMARY"
      - name: "Show package, versionCode and signing certificate (compare with the general APK: same package, same certificate and a higher versionCode install over it)"
        run: |
          APK=android/app/build/outputs/apk/g7exec/app-g7exec.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | grep -E "^package:" | cut -c1-160
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "${KEYSTORE_FILE:-}" ]; then echo "::warning::signed with a temporary key: this APK will NOT install over the general app"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: henge-g7-exec-apk
          path: android/app/build/outputs/apk/g7exec/app-g7exec.apk
      - name: Show the start APK's package, versionCode and certificate (only when it is published)
        if: ${{ inputs.publish_start == true }}
        run: |
          APK=android/app/build/outputs/apk/g7start/app-g7start.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | grep -E "^package:" | cut -c1-160
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.publish_start == true }}
        with:
          name: henge-g7-start-apk
          path: android/app/build/outputs/apk/g7start/app-g7start.apk
