# .github/workflows/android-engine.yml
#
# Builds the engine core (core/*.c, host/jit_region.c, host/disk.c, host/enter.S)
# for non-Apple targets and links the C-only engine test tests/test_mmu.c.
#   1. native arm64 Linux: build, link, and RUN test_mmu (arm64 code runs here).
#   2. Android NDK (API 30): build and link the same; nothing runs on the runner.
# The goal is to find out, file by file, what stops the engine from building
# outside Apple platforms. Compiler output is kept in the job log. The existing
# build-henge.yml is untouched and still runs on every push.

name: Android engine build

on:
  workflow_dispatch: {}
  push:
    branches:
      - research/android-port
    paths:
      - core/**
      - host/**
      - tests/**
      - tests/test_engine_smoke.c
      - tools/engine-build.sh
      - .github/workflows/android-engine.yml

env:
  NDK_VERSION: r27c

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the engine core and link test_mmu
        run: CC=clang EXTRA_LIBS="-lpthread -lm" tools/engine-build.sh build-linux
      - name: Run the engine tests natively (each test reported on its own)
        run: |
          status=0
          for t in test_mmu test_jit test_mem test_exc; do
            echo "=== $t"
            rc=0
            timeout 300 build-linux/$t || rc=$?
            echo "=== $t exit code $rc"
            [ $rc = 0 ] || status=1
          done
          exit $status

      - name: Build the device models and link test_devices (graphics runs on a stub that draws nothing)
        id: devices
        continue-on-error: true
        run: CC=clang EXTRA_LIBS="-lpthread -lm" tools/devices-build.sh build-linux
      - name: Run test_devices natively
        if: steps.devices.outcome == 'success'
        continue-on-error: true
        run: |
          rc=0
          timeout 300 build-linux/test_devices || rc=$?
          echo "=== test_devices exit code $rc"
          exit $rc

  android-ndk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the Android NDK
        run: |
          curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip -d "$HOME"
          echo "NDK_ROOT=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build the engine core and link test_mmu for Android
        run: |
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/engine-build.sh build-android
          file build-android/test_mmu build-android/test_jit
      - name: Build the device models and link test_devices for Android (graphics on a stub)
        continue-on-error: true
        run: CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/devices-build.sh build-android
      - uses: actions/upload-artifact@v4
        with:
          name: engine-tests-android-arm64
          path: |
            build-android/test_mmu
            build-android/test_jit
            build-android/test_mem
            build-android/test_exc
            build-android/test_devices
