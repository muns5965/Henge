# .github/workflows/android-engine.yml
#
# Builds the engine core (core/*.c, host/jit_region.c, host/disk.c, host/enter.S)
# for non-Apple targets and links the C-only engine test tests/test_mmu.c.
#   1. native arm64 Linux: build, link, and RUN test_mmu (arm64 code runs here).
#   2. Android NDK (API 30): build and link the same; nothing runs on the runner.
# The goal is to find out, file by file, what stops the engine from building
# outside Apple platforms. Compiler output is kept in the job log. The existing
# build-henge.yml is untouched and still runs on every push.

name: Android engine build

on:
  workflow_dispatch: {}
  push:
    branches:
      - research/android-port
    paths:
      - core/**
      - host/**
      - tests/**
      - tests/test_engine_smoke.c
      - tools/engine-build.sh
      - tools/devices-build.sh
      - tools/restore-android-check.sh
      - tools/curl-test.sh
      - tools/curltool-build.sh
      - tools/check-apple-ca.sh
      - android/app/src/main/java/**
      - devices/**
      - third_party/**
      - .github/workflows/android-engine.yml

env:
  NDK_VERSION: r27c

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the engine core and link test_mmu
        run: CC=clang EXTRA_LIBS="-lpthread -lm" tools/engine-build.sh build-linux
      - name: Run the engine tests natively (each test reported on its own)
        run: |
          status=0
          for t in test_mmu test_jit test_mem test_exc; do
            echo "=== $t"
            rc=0
            timeout 300 build-linux/$t || rc=$?
            echo "=== $t exit code $rc"
            [ $rc = 0 ] || status=1
          done
          exit $status

      - name: Build the device models and link test_devices (graphics runs on a stub that draws nothing)
        id: devices
        continue-on-error: true
        run: CC=clang EXTRA_LIBS="-lpthread -lm" tools/devices-build.sh build-linux
      - name: Run test_devices natively
        if: steps.devices.outcome == 'success'
        continue-on-error: true
        run: |
          rc=0
          timeout 300 build-linux/test_devices || rc=$?
          echo "=== test_devices exit code $rc"
          rc2=0
          if [ -f build-linux/test_vm ]; then
            timeout 120 build-linux/test_vm || rc2=$?
            echo "=== test_vm exit code $rc2"
          else
            echo "=== test_vm was not built"; rc2=1
          fi
          rc3=0
          if [ -f build-linux/vmrun ]; then
            # vmrun on a `b .` ROM with blank files it makes itself: it must run, report changes, stop, and exit 0
            python3 -c "import struct,sys; sys.stdout.buffer.write(struct.pack('<I',0x14000000)*16384)" > spin_rom.bin
            timeout 60 build-linux/vmrun --rom spin_rom.bin --disk blank_disk.img --aux blank_aux.img --make-blank --recreate-blank --psci-log --usb-probe --disk-gb 2 --ram-mb 256 --jit-mb 64 --seconds 3 --installer || rc3=$?
            echo "=== vmrun exit code $rc3"
          else
            echo "=== vmrun was not built"; rc3=1
          fi
          rc4=0
          if [ -f build-linux/romextract ]; then
            # no network here: only the refusals can be checked (wrong input size = 3; garbage of the right size = 4)
            head -c 100 /dev/zero > rx_short.bin
            r=0; build-linux/romextract rx_short.bin rx_out.bin || r=$?; echo "romextract short input exit $r (want 3)"; [ $r = 3 ] || rc4=1
            head -c 859848 /dev/urandom > rx_junk.bin
            r=0; build-linux/romextract rx_junk.bin rx_out.bin || r=$?; echo "romextract junk input exit $r (want 4)"; [ $r = 4 ] || rc4=1
            [ ! -e rx_out.bin ] || { echo "romextract wrote an output on failure"; rc4=1; }
          else
            echo "=== romextract was not built"; rc4=1
          fi
          [ $rc = 0 ] && [ $rc2 = 0 ] && [ $rc3 = 0 ] && [ $rc4 = 0 ]

      - name: Test the per-VM ECID store (plain java, no framework)
        run: |
          mkdir -p build-java
          javac -d build-java android/app/src/main/java/dev/muns/hengeprobe/VmEcid.java tests/java/VmEcidTest.java
          java -cp build-java dev.muns.hengeprobe.VmEcidTest

      - name: Look at the TSS server's certificate chain with our client (informational; the chain does not depend on the device)
        continue-on-error: true
        run: |
          set +e
          CURLTOOL_CFLAGS=-DHV_ALLOW_CA_ENV tools/curltool-build.sh build-curltest > /dev/null 2>&1
          build-curltest/curl_tool "https://gs.apple.com/TSS/controller?action=2" --discard 2>&1 | head -120
          echo "--- experiment: trust only Apple Root CA (taken from the server's chain, accepted only if its SHA-256 equals the one Apple publishes)"
          mkdir -p apple-ca && echo | openssl s_client -connect gs.apple.com:443 -servername gs.apple.com -showcerts 2>/dev/null | awk '/BEGIN CERT/{n++} {if(n==3) print}' | sed '/END CERT/q' > apple-ca/root.pem
          FP=$(openssl x509 -in apple-ca/root.pem -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2 | tr -d : | tr a-f A-F)
          echo "root SHA-256: $FP"
          if [ "$FP" = "B0B1730ECBC7FF4505142C49F1295E6EDA6BCAED7E2C68C5BE91B5A11001F024" ]; then
            echo "fingerprint matches Apple's published value"
            HV_CA_PATH=apple-ca build-curltest/curl_tool "https://gs.apple.com/TSS/controller?action=2" --discard 2>&1 | grep -E "TLS_VERIFIED|RC=|VERIFY_FLAGS"
          else
            echo "fingerprint does NOT match; not trusting it"
          fi
          echo "--- the same host with openssl, for comparison"
          echo | openssl s_client -connect gs.apple.com:443 -servername gs.apple.com -showcerts 2>&1 | grep -E "^ *[0-9] s:|^ *i:|a:PKEY|v:NotBefore|Verify return|verify error|Verification" | head -30

      - name: Test the HTTP/TLS client that replaces libcurl on Android (local servers; public check skipped without network)
        run: tools/curl-test.sh build-curltest

  android-ndk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the Android NDK
        run: |
          curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip -d "$HOME"
          echo "NDK_ROOT=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build the HTTP/TLS test tool for Android (the copy the APK ships)
        run: CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" CURLTOOL_LIBS="" tools/curltool-build.sh build-android-curltool

      - name: Build the engine core and link test_mmu for Android
        run: |
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/engine-build.sh build-android
          file build-android/test_mmu build-android/test_jit
      - name: Build the device models and link test_devices for Android (graphics on a stub)
        continue-on-error: true
        run: CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/devices-build.sh build-android
      - name: Survey the macOS-restore libraries for Android (compile, then integrated link; informational)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq cmake > /dev/null
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" tools/restore-android-check.sh build-android 2>&1 | tee build-android/restore-survey.txt
      - uses: actions/upload-artifact@v4
        with:
          name: engine-tests-android-arm64
          path: |
            build-android/test_mmu
            build-android/test_jit
            build-android/test_mem
            build-android/test_exc
            build-android/test_devices
            build-android/test_vm
            build-android/vmrun
            build-android/romextract
            build-android/restore-survey.txt
