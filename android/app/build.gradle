plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.muns.hengeprobe'
    compileSdk 34

    // CI installs a known NDK and points NDK_ROOT at it.
    if (System.getenv('NDK_ROOT')) {
        ndkPath System.getenv('NDK_ROOT')
    }

    defaultConfig {
        applicationId 'dev.muns.hengeprobe'
        minSdk 30          // memfd_create is in bionic from API 30
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            // The probe is a test tool; debug signing is enough to install it.
        }
    }
}
