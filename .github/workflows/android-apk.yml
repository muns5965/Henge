# .github/workflows/android-apk.yml
#
# Builds the Henge JIT probe app (android/) into a debug-signed APK, so the
# split-mapping test can be installed and run on a phone without adb. The app
# compiles host/jit_region.c unchanged and shows the result on screen.
# Runs on pushes to research/android-port that touch the app or the JIT source,
# or by hand. build-henge.yml and android-jit-probe.yml are untouched.

name: Android probe APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - research/android-port
    paths:
      - android/**
      - host/**
      - core/**
      - devices/**
      - third_party/lzfse/**
      - tests/**
      - tools/engine-build.sh
      - tools/devices-build.sh
      - tools/curltool-build.sh
      - tools/bmprobe-build.sh
      - tools/ipswdl-build.sh
      - tools/check-apple-ca.sh
      - third_party/mbedtls/**
      - tools/vmrun-irecv-build.sh
      - tools/vmrun-tss-build.sh
      - tools/restore-selftest-build.sh
      - tools/vmrun-preflight-build.sh
      - tools/vmrun-install-g0-build.sh
      - tools/ui-runner-vm-build.sh
      - tools/check-runner-vm-safe.sh
      - tools/check-c13-source.sh
      - third_party/idevicerestore/**
      - third_party/usbmuxd/**
      - third_party/libusbmuxd/**
      - third_party/libimobiledevice/**
      - third_party/libplist/**
      - third_party/libtatsu/**
      - third_party/libzip/**
      - third_party/curl_include/**
      - third_party/libirecovery/**
      - third_party/libimobiledevice-glue/**
      - third_party/libusb-1.0/**
      - third_party/restore_config/**
      - .github/workflows/android-apk.yml

env:
  NDK_VERSION: r27c

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android NDK
        run: |
          curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip -d "$HOME"
          echo "NDK_ROOT=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      # The engine tests are built as executables and shipped inside the APK under
      # lib*.so names, so the app can run them as separate processes (no adb).
      - name: Build the engine tests for Android and add them to the APK
        run: |
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/engine-build.sh build-engine
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          for t in mmu jit mem exc; do cp build-engine/test_$t android/app/src/main/jniLibs/arm64-v8a/libtest_$t.so; done
          # Device models (graphics on a stub that draws nothing). A failure here must not stop the APK.
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/devices-build.sh build-engine || echo "::warning::the device or VM tests did not all build; the APK goes with those that did"
          for t in devices vm; do
            if [ -f build-engine/test_$t ]; then cp build-engine/test_$t android/app/src/main/jniLibs/arm64-v8a/libtest_$t.so; fi
          done
          if [ -f build-engine/vmrun ]; then cp build-engine/vmrun android/app/src/main/jniLibs/arm64-v8a/libvmrun.so; fi
          # vmrun with libirecovery (the "restore library USB connection" button). Its own program, so a failure here leaves the plain vmrun and the rest alone.
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/vmrun-irecv-build.sh build-engine \
            && cp build-engine/vmrun_irecv android/app/src/main/jniLibs/arm64-v8a/libvmrunirecv.so || echo "::warning::vmrun with libirecovery did not build; the APK goes without that button's program"
          # vmrun with the TSS probe (the "TSS 서명 가능성 확인" button): its own program; the APK goes without that button's program if it fails.
          command -v cmake > /dev/null || sudo apt-get install -y -qq cmake > /dev/null
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/vmrun-tss-build.sh build-engine \
            && cp build-engine/vmrun_tss android/app/src/main/jniLibs/arm64-v8a/libvmruntss.so || echo "::warning::vmrun with the TSS probe did not build; the APK goes without that button's program"
          if [ -f build-engine/romextract ]; then cp build-engine/romextract android/app/src/main/jniLibs/arm64-v8a/libromextract.so; fi
          # The HTTP/TLS client that replaces libcurl (host/curl_mbedtls.c) with its test driver: the app's "HTTPS·CA" buttons run it.
          # A failure here fails the APK: the HTTPS buttons need it. No -DHV_ALLOW_CA_ENV here: the shipped copy trusts only the system stores.
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" CURLTOOL_LIBS="" tools/curltool-build.sh build-curltool \
            && cp build-curltool/curl_tool android/app/src/main/jniLibs/arm64-v8a/libcurltool.so
          # BuildManifest probe (the "BuildManifest 부분 조회" button): remote ZIP64 reader + chip/board scan. Optional: the APK goes without that button's program if it fails.
          command -v cmake > /dev/null || sudo apt-get install -y -qq cmake > /dev/null
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" CURLTOOL_LIBS="" tools/bmprobe-build.sh build-bmprobe \
            && cp build-bmprobe/bm_probe android/app/src/main/jniLibs/arm64-v8a/libbmprobe.so || echo "::warning::the BuildManifest probe did not build; the APK goes without that button's program"
          # IPSW downloader (the "IPSW 부분 다운로드" buttons): its own program, shipped configuration (no test switch; --stop-after required in this stage). Optional like the other probes.
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" CURLTOOL_LIBS="" tools/ipswdl-build.sh build-ipswdl \
            && cp build-ipswdl/ipsw_dl android/app/src/main/jniLibs/arm64-v8a/libipswdl.so || echo "::warning::the IPSW downloader did not build; the APK goes without that button's program"
          # The whole restore stack with its self-test (the "restore tool self-test" button). Its own program; a failure leaves the APK without that button's program.
          command -v cmake > /dev/null || sudo apt-get install -y -qq cmake > /dev/null
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="" tools/restore-selftest-build.sh build-restore \
            && cp build-restore/restore_selftest android/app/src/main/jniLibs/arm64-v8a/librestoreselftest.so || echo "::warning::the restore self-test did not build; the APK goes without that button's program"
          # vmrun with the real restore tool in it (the "복원 도구 장치 감지" button, --restore-preflight): needs the restore stack just built. Its own program; optional.
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" PF_THREADLIB="" tools/vmrun-preflight-build.sh build-engine build-restore \
            && cp build-engine/vmrun_preflight android/app/src/main/jniLibs/arm64-v8a/libvmrunpreflight.so || echo "::warning::vmrun with the restore tool did not build; the APK goes without that button's program"
          # vmrun with the install entry point and the G0 test in it (the "[G0] 복원 진입점 시험" button, --install-g0): host/install.c up to the tool's stop A, storage read-only. A test program, not an installer; optional.
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" PF_THREADLIB="" tools/vmrun-install-g0-build.sh build-engine build-restore \
            && cp build-engine/vmrun_g0 android/app/src/main/jniLibs/arm64-v8a/libvmrung0.so || echo "::warning::vmrun with the G0 test did not build; the APK goes without that button's program"
          # The C1-1 runner (the "[C1-1]" button): synthetic mode, no virtual machine, no network code (tools/check-runner-safe.sh checks the binary). Optional: the APK goes without that button's program if it fails.
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" NM="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" PF_THREADLIB="" tools/ui-runner-build.sh build-engine \
            && cp build-engine/ui_runner android/app/src/main/jniLibs/arm64-v8a/libuirunner.so || echo "::warning::the C1-1 runner did not build; the APK goes without that button's program"
          # The C1-3 VM runner (ui_runner_vm, real engine). Shipped, but VmRunnerLauncher.START_ENABLED is false: nothing starts it. NOT optional: a build or static-check failure fails the APK.
          set -e
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" NM="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" READELF="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" EXTRA_LIBS="-llog" PF_THREADLIB="" tools/ui-runner-vm-build.sh build-engine
          cp build-engine/ui_runner_vm android/app/src/main/jniLibs/arm64-v8a/libuirunnervm.so
          ls -l android/app/src/main/jniLibs/arm64-v8a

      - name: Install SDK platform, build tools and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # The signing key lives in repository secrets, never in the repository.
      # Without ANDROID_KEYSTORE_BASE64 the APK is signed with a temporary key.
      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/probe.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/probe.keystore" >> "$GITHUB_ENV"
            echo "Signing with the fixed key from secrets."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a temporary key (uninstall needed before each update)."
          fi

      - name: Build the debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: C1-3 checks on the sources and the APK (launcher switch off, runner file named only in VmRunnerLauncher, both runners in the APK as AArch64)
        run: |
          bash -n tools/check-c13-source.sh
          READELF="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" tools/check-c13-source.sh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Show the APK, its native library and signing certificate
        run: |
          ls -l android/app/build/outputs/apk/debug/
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E "lib/|AndroidManifest"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: henge-jit-probe-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
