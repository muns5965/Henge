# .github/workflows/android-engine.yml
#
# Builds the engine core (core/*.c, host/jit_region.c, host/disk.c, host/enter.S)
# for non-Apple targets and links the C-only engine test tests/test_mmu.c.
#   1. native arm64 Linux: build, link, and RUN test_mmu (arm64 code runs here).
#   2. Android NDK (API 30): build and link the same; nothing runs on the runner.
# The goal is to find out, file by file, what stops the engine from building
# outside Apple platforms. Compiler output is kept in the job log. The existing
# build-henge.yml is untouched and still runs on every push.

name: Android engine build

on:
  workflow_dispatch: {}
  push:
    branches:
      - research/android-port
    paths:
      - core/**
      - host/**
      - tests/**
      - tests/test_engine_smoke.c
      - android/app/src/g7exec/**
      - tools/check-g7exec-launcher-source.sh
      - tools/g7-exec-launcher-test.sh
      - tools/g7exec-apk-check-test.sh
      - tools/apk-version-test.sh
      - tools/g7-ipsw-check-test.sh
      - tools/ci-version-code.sh
      - tools/check-apk-update.sh
      - tools/check-g7exec-apk.sh
      - tools/engine-build.sh
      - tools/devices-build.sh
      - tools/restore-android-check.sh
      - tools/curl-test.sh
      - tools/curltool-build.sh
      - tools/tatsu-test.sh
      - tools/tss-stage-test.sh
      - tools/tss-dryrun-test.sh
      - tools/remote-zip-test.sh
      - tools/bmprobe-build.sh
      - tools/ipswdl-build.sh
      - tools/ipswdl-test.sh
      - tools/check-no-test-flags.sh
      - tools/check-apple-ca.sh
      - tools/irecv-test.sh
      - tools/preflight-test.sh
      - tools/install-g0-test.sh
      - tools/install-g1-test.sh
      - tools/c0b0-test.sh
      - tools/c1-test.sh
      - tools/check-runner-safe.sh
      - tools/ui-runner-build.sh
      - tools/c1vm-test.sh
      - tools/pvg-test.sh
      - tools/install-plan-test.sh
      - tools/usb-ctrl-test.sh
      - tools/usb-faults-test.sh
      - tests/test_usb_ctrl.c
      - tests/test_shim_ctrl.c
      - tests/test_usb_faults.c
      - host/libusb_shim.c
      - devices/virtio_usb.c
      - host/usb_host.c
      - tools/check-install-plan-isolation.sh
      - tools/check-c13-source.sh
      - tools/check-runner-vm-safe.sh
      - tools/ui-runner-vm-build.sh
      - tools/check-g4ui-launcher-source.sh
      - tools/check-installed-launcher-source.sh
      - tools/ui-runner-vm-g4-install-build.sh
      - android/app/src/main/java/dev/muns/hengeprobe/VmRunnerG4Launcher.java
      - android/app/src/main/java/dev/muns/hengeprobe/VmRunnerG4Verdict.java
      - android/app/src/main/java/dev/muns/hengeprobe/VmRunnerG4Run.java
      - tests/java/**
      - android/app/src/main/java/dev/muns/hengeprobe/RomSlice.java
      - android/app/src/main/java/dev/muns/hengeprobe/RomSliceResultSlot.java
      - android/app/src/main/java/dev/muns/hengeprobe/RomBranchFinder.java
      - android/app/src/main/java/dev/muns/hengeprobe/AddrRefFinder.java
      - tools/vmrun-install-g0-build.sh
      - tools/netguard-test.sh
      - tools/fdr-session-test.sh
      - tools/disk-policy-test.sh
      - tools/g7-preflight-test.sh
      - tools/g7-probe-test.sh
      - tools/check-g7-probe-safe.sh
      - tools/check-g7-probe-launcher-source.sh
      - tools/g7-probe-build.sh
      - tools/g7-restore-test.sh
      - tools/g7-runner-test.sh
      - tools/g7-net-test.sh
      - tools/g7-runner-build.sh
      - tools/restore-g7-build.sh
      - tools/check-restore-g7-build.sh
      - host/g7_runner.c
      - host/g7_runner_real.c
      - host/g7_runner_real.h
      - host/g7_restore.c
      - host/g7_restore.h
      - tests/test_g7_restore.c
      - host/g7_probe.c
      - host/g7_preflight.c
      - host/g7_preflight.h
      - host/runner_g7_core.c
      - host/runner_g7_core.h
      - tests/test_g7_preflight.c
      - tests/test_g7_runner.c
      - tools/vmrun-preflight-build.sh
      - tools/vmrun-irecv-build.sh
      - tools/vmrun-tss-build.sh
      - tools/tss-probe-test.sh
      - tools/download-test.sh
      - tools/dnload-test.sh
      - tools/restore-selftest-build.sh
      - tools/restore-selftest.sh
      - third_party/idevicerestore/**
      - third_party/restore_config/**
      - third_party/curl_include/**
      - android/app/src/main/java/**
      - devices/**
      - third_party/**
      - .github/workflows/android-engine.yml

env:
  NDK_VERSION: r27c

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the engine core and link test_mmu
        run: CC=clang EXTRA_LIBS="-lpthread -lm" tools/engine-build.sh build-linux
      - name: Run the engine tests natively (each test reported on its own)
        run: |
          status=0
          for t in test_mmu test_jit test_mem test_exc; do
            echo "=== $t"
            rc=0
            timeout 300 build-linux/$t || rc=$?
            echo "=== $t exit code $rc"
            [ $rc = 0 ] || status=1
          done
          exit $status

      - name: Build the device models and link test_devices (graphics runs on a stub that draws nothing)
        id: devices
        continue-on-error: true
        run: CC=clang EXTRA_LIBS="-lpthread -lm" tools/devices-build.sh build-linux
      - name: Run test_devices natively
        if: steps.devices.outcome == 'success'
        continue-on-error: true
        run: |
          rc=0
          timeout 300 build-linux/test_devices || rc=$?
          echo "=== test_devices exit code $rc"
          rc2=0
          if [ -f build-linux/test_vm ]; then
            timeout 120 build-linux/test_vm || rc2=$?
            echo "=== test_vm exit code $rc2"
          else
            echo "=== test_vm was not built"; rc2=1
          fi
          rc3=0
          if [ -f build-linux/vmrun ]; then
            # vmrun on a `b .` ROM with blank files it makes itself: it must run, report changes, stop, and exit 0
            python3 -c "import struct,sys; sys.stdout.buffer.write(struct.pack('<I',0x14000000)*16384)" > spin_rom.bin
            timeout 60 build-linux/vmrun --rom spin_rom.bin --disk blank_disk.img --aux blank_aux.img --make-blank --recreate-blank --psci-log --usb-probe --disk-gb 2 --ram-mb 256 --jit-mb 64 --seconds 3 --installer || rc3=$?
            echo "=== vmrun exit code $rc3"
          else
            echo "=== vmrun was not built"; rc3=1
          fi
          rc4=0
          if [ -f build-linux/romextract ]; then
            # no network here: only the refusals can be checked (wrong input size = 3; garbage of the right size = 4)
            head -c 100 /dev/zero > rx_short.bin
            r=0; build-linux/romextract rx_short.bin rx_out.bin || r=$?; echo "romextract short input exit $r (want 3)"; [ $r = 3 ] || rc4=1
            head -c 859848 /dev/urandom > rx_junk.bin
            r=0; build-linux/romextract rx_junk.bin rx_out.bin || r=$?; echo "romextract junk input exit $r (want 4)"; [ $r = 4 ] || rc4=1
            [ ! -e rx_out.bin ] || { echo "romextract wrote an output on failure"; rc4=1; }
          else
            echo "=== romextract was not built"; rc4=1
          fi
          [ $rc = 0 ] && [ $rc2 = 0 ] && [ $rc3 = 0 ] && [ $rc4 = 0 ]

      - name: Test the per-VM ECID store (plain java, no framework)
        run: |
          mkdir -p build-java
          javac -d build-java android/app/src/main/java/dev/muns/hengeprobe/VmEcid.java tests/java/VmEcidTest.java
          java -cp build-java dev.muns.hengeprobe.VmEcidTest

      - name: "Test the C1-3 launcher (plain java: null/missing paths are refused before any spawn either way; whatever START_ENABLED currently is, startEnabled() agrees) and its source rules"
        run: |
          bash -n tools/check-c13-source.sh
          tools/check-c13-source.sh
          mkdir -p build-java-c13
          javac -encoding UTF-8 -d build-java-c13 android/app/src/main/java/dev/muns/hengeprobe/VmRunnerLauncher.java tests/java/VmRunnerLauncherTest.java
          java -cp build-java-c13 dev.muns.hengeprobe.VmRunnerLauncherTest

      - name: "Test the G7 probe launcher (plain java, fake spawner, no real process: MISSING lib/ROM/ECID refused before any spawn, exact option list, exit-code meanings, ECID masked, timeout destroys, output capped) and its source rules"
        run: |
          bash -n tools/check-g7-probe-launcher-source.sh
          tools/check-g7-probe-launcher-source.sh
          mkdir -p build-java-g7
          J=android/app/src/main/java/dev/muns/hengeprobe
          javac -encoding UTF-8 -d build-java-g7 $J/G7ProbeLauncher.java $J/VmRomCheck.java $J/RomSlice.java $J/VmEcid.java $J/VmRunnerInstalledLauncher.java tests/java/G7ProbeLauncherTest.java
          java -cp build-java-g7 dev.muns.hengeprobe.G7ProbeLauncherTest
          tools/check-g7exec-launcher-source.sh
          tools/g7-exec-launcher-test.sh build-java-g7exec
          tools/g7exec-apk-check-test.sh build-g7exec-apkcheck
          tools/apk-version-test.sh build-apkversion
          tools/g7-ipsw-check-test.sh build-g7-ipswchk

      - name: "Test the G4 UI launcher (plain java: every call, even a fully valid one, is refused with REFUSAL and reaches the spawner zero times while START_ENABLED=false; buildCommand's exact option list; RUN_SECONDS >= 460) and its source rules"
        run: |
          bash -n tools/check-g4ui-launcher-source.sh
          tools/check-g4ui-launcher-source.sh
          mkdir -p build-java-g4ui
          javac -encoding UTF-8 -d build-java-g4ui android/app/src/main/java/dev/muns/hengeprobe/VmRunnerG4Launcher.java tests/java/VmRunnerG4LauncherTest.java
          java -cp build-java-g4ui dev.muns.hengeprobe.VmRunnerG4LauncherTest

      - name: "Test the installed-disk launcher (plain java: with START_ENABLED=false every call, even a fully valid one, is refused and reaches the spawner zero times; blank/missing images and bad ECID/seed are refused; the readiness report writes nothing) and its source rules"
        run: |
          bash -n tools/check-installed-launcher-source.sh
          tools/check-installed-launcher-source.sh
          mkdir -p build-java-inst
          javac -encoding UTF-8 -d build-java-inst android/app/src/main/java/dev/muns/hengeprobe/VmRunnerInstalledLauncher.java android/app/src/main/java/dev/muns/hengeprobe/VmInstalledDiag.java android/app/src/main/java/dev/muns/hengeprobe/VmRomCheck.java android/app/src/main/java/dev/muns/hengeprobe/RomSlice.java android/app/src/main/java/dev/muns/hengeprobe/VmEcid.java tests/java/VmRunnerInstalledLauncherTest.java
          java -cp build-java-inst dev.muns.hengeprobe.VmRunnerInstalledLauncherTest
          javac -encoding UTF-8 -d build-java-inst android/app/src/main/java/dev/muns/hengeprobe/VmRomCheck.java android/app/src/main/java/dev/muns/hengeprobe/RomSlice.java android/app/src/main/java/dev/muns/hengeprobe/VmInstalledDiag.java android/app/src/main/java/dev/muns/hengeprobe/VmRunnerInstalledLauncher.java android/app/src/main/java/dev/muns/hengeprobe/VmEcid.java tests/java/VmRomCheckTest.java
          java -cp build-java-inst dev.muns.hengeprobe.VmRomCheckTest

      - name: "Test the G4 UI verdict logic (plain java: exit code 4 is always FAILED whether or not a RESULT line arrived; exit 0 is a PASS candidate only when the RESULT line itself says 'g4 passed'; a missing/duplicate/mismatched RESULT line, an unfinished reader, or an overflowed result-line count are all FAILED or NO_VERDICT, never a pass)"
        run: |
          mkdir -p build-java-g4verdict
          javac -encoding UTF-8 -d build-java-g4verdict android/app/src/main/java/dev/muns/hengeprobe/VmRunnerG4Verdict.java tests/java/VmRunnerG4VerdictTest.java
          java -cp build-java-g4verdict dev.muns.hengeprobe.VmRunnerG4VerdictTest

      - name: "Test the G4 UI process drain (plain java, real child processes, no VM/Android/network/Apple TSS request: a child writing well past a pipe buffer before exiting does not deadlock; a RESULT line printed immediately before exit is still collected; exit code 4 is FAILED whether or not a RESULT line arrived; a process that outlives its timeout is force-killed and reported as timed out, never a pass)"
        run: |
          mkdir -p build-java-g4run
          javac -encoding UTF-8 -d build-java-g4run android/app/src/main/java/dev/muns/hengeprobe/VmRunnerG4Verdict.java android/app/src/main/java/dev/muns/hengeprobe/VmRunnerG4Run.java tests/java/VmRunnerG4RunTest.java
          java -cp build-java-g4run dev.muns.hengeprobe.VmRunnerG4RunTest

      - name: "Test the nativeStart() return-value decision both screens share (plain java: r==0 is the only success, r==1/-1/-2 are all failures)"
        run: |
          mkdir -p build-java-nstart
          javac -encoding UTF-8 -d build-java-nstart android/app/src/main/java/dev/muns/hengeprobe/NativeStart.java tests/java/NativeStartTest.java
          java -cp build-java-nstart dev.muns.hengeprobe.NativeStartTest

      - name: "Test StopOnce (plain java): the race guard VmDisplayActivity uses so onDestroy() and its watchdog never both stop the same vm runner"
        run: |
          mkdir -p build-java-stoponce
          javac -encoding UTF-8 -d build-java-stoponce android/app/src/main/java/dev/muns/hengeprobe/StopOnce.java tests/java/StopOnceTest.java
          java -cp build-java-stoponce dev.muns.hengeprobe.StopOnceTest

      - name: "Test the G0 verdict the app shows (plain java; exit code, result lines, final vmrun line, output completeness)"
        run: |
          mkdir -p build-java-g0
          javac -encoding UTF-8 -d build-java-g0 android/app/src/main/java/dev/muns/hengeprobe/G0Verdict.java tests/java/G0VerdictTest.java
          java -cp build-java-g0 dev.muns.hengeprobe.G0VerdictTest

      - name: "Test the ROM slice reader the app uses (plain java, a synthetic ROM: size/hash gate, bounds, 4 KiB total, no real ROM bytes)"
        run: |
          mkdir -p build-java-romslice
          javac -encoding UTF-8 -Xlint:all -d build-java-romslice android/app/src/main/java/dev/muns/hengeprobe/RomSlice.java tests/java/RomSliceTest.java
          java -cp build-java-romslice dev.muns.hengeprobe.RomSliceTest

      - name: "Test the ROM-slice result slot (plain java: generation, the reasons a result is dropped, completion order)"
        run: |
          mkdir -p build-java-romslot
          javac -encoding UTF-8 -Xlint:all -d build-java-romslot android/app/src/main/java/dev/muns/hengeprobe/RomSliceResultSlot.java tests/java/RomSliceResultSlotTest.java
          java -cp build-java-romslot dev.muns.hengeprobe.RomSliceResultSlotTest

      - name: "Test the direct-branch search the app uses (plain java, synthetic ROMs: B/BL targets, size/hash gate, totals vs shown, no ROM bytes in the output)"
        run: |
          mkdir -p build-java-romfind
          javac -encoding UTF-8 -Xlint:all -d build-java-romfind android/app/src/main/java/dev/muns/hengeprobe/RomSlice.java android/app/src/main/java/dev/muns/hengeprobe/RomBranchFinder.java tests/java/RomBranchFinderTest.java
          java -cp build-java-romfind dev.muns.hengeprobe.RomBranchFinderTest

      - name: "Test the address-reference search the app uses (plain java: real ADRP/ADD words, 8-instruction window, overwrite and branch stops, supported encodings only, totals vs shown)"
        run: |
          mkdir -p build-java-addrref
          javac -encoding UTF-8 -Xlint:all -d build-java-addrref android/app/src/main/java/dev/muns/hengeprobe/RomSlice.java android/app/src/main/java/dev/muns/hengeprobe/AddrRefFinder.java tests/java/AddrRefFinderTest.java
          java -cp build-java-addrref dev.muns.hengeprobe.AddrRefFinderTest

      - name: Test the USB descriptor parser (synthetic DFU configuration descriptors)
        run: |
          cc -std=gnu11 -Wall -Wextra -o test_usbdesc tests/test_usbdesc.c
          ./test_usbdesc

      - name: Test libirecovery opening the virtual USB device (real libirecovery + libusb stand-in + probe, against a stand-in for the ROM; five scenarios)
        run: CC=clang tools/irecv-test.sh build-irecvtest

      - name: Test the DFU download probe A0-A2 against a stand-in for the ROM (eleven scenarios; exact requests, bytes, order, stop rules; nothing real is sent)
        run: CC=clang tools/dnload-test.sh build-dnloadtest
      - name: Build vmrun with libirecovery in it (--irecv-probe)
        run: CC=clang EXTRA_LIBS="-lpthread -lm" tools/vmrun-irecv-build.sh build-linux

      - name: Build vmrun with the TSS probe in it (--tss-probe; nothing is sent here) and check that it refuses to start without the DFU boot
        run: |
          command -v cmake > /dev/null || sudo apt-get install -y -qq cmake > /dev/null
          CC=clang EXTRA_LIBS="-lpthread -lm" tools/vmrun-tss-build.sh build-linux
          set +e
          build-linux/vmrun_tss --tss-probe --rom /nonexistent --disk /nonexistent --aux /nonexistent 2>&1 | tee build-linux/tss-refuse.txt
          grep -q "needs --installer" build-linux/tss-refuse.txt

      - name: TSS probe core against mock IPSW and TSS servers (one attempt whatever goes wrong; nothing sent when anything before it fails; no value in the output)
        run: CC=clang tools/tss-probe-test.sh build-tssprobe

      - name: Test the real libtatsu (TSS requests) through the HTTP client, against mock TSS servers (https-only build and test build)
        run: tools/tatsu-test.sh build-curltest

      - name: The shipped build has no test switches and libtatsu is https-only there
        run: CC=clang tools/check-no-test-flags.sh build-flagcheck

      - name: TSS dry run (real request builders, send path compiled out, no value printed) on a synthetic identity
        run: CC=clang tools/tss-dryrun-test.sh build-dryrun

      - name: Remote ZIP64 partial reader (BuildManifest.plist) against local Range servers (a 5 GiB virtual archive; nothing leaves the runner)
        run: CC=clang tools/remote-zip-test.sh build-rz

      - name: IPSW downloader (resume, Range/ETag/If-Range, metadata recovery, SHA-256, free space, lock, cancel, >4 GiB offsets) against local Range servers; nothing leaves the runner
        run: CC=clang tools/ipswdl-test.sh build-ipswdl

      - name: BuildManifest probe builds and scans a local manifest for the virtual machine's chip/board (no network)
        run: |
          CC=clang tools/bmprobe-build.sh build-bmp
          python3 -c "import plistlib;i={'UniqueBuildID':b'x','ApChipID':'0xfe00','ApBoardID':'0x20','Info':{}};plistlib.dump({'BuildIdentities':[i,dict(i,ApBoardID='0x22')]},open('build-bmp/bm.plist','wb'))"
          build-bmp/bm_probe --file build-bmp/bm.plist | tee build-bmp/bm.out
          grep -q "1 with chip and board" build-bmp/bm.out

      - name: Look at the TSS server's certificate chain with our client (informational; the chain does not depend on the device)
        continue-on-error: true
        run: |
          set +e
          CURLTOOL_CFLAGS=-DHV_ALLOW_CA_ENV tools/curltool-build.sh build-curltest > /dev/null 2>&1
          build-curltest/curl_tool "https://gs.apple.com/TSS/controller?action=2" --discard 2>&1 | head -120
          echo "--- experiment: trust only Apple Root CA (taken from the server's chain, accepted only if its SHA-256 equals the one Apple publishes)"
          mkdir -p apple-ca && echo | openssl s_client -connect gs.apple.com:443 -servername gs.apple.com -showcerts 2>/dev/null | awk '/BEGIN CERT/{n++} {if(n==3) print}' | sed '/END CERT/q' > apple-ca/root.pem
          FP=$(openssl x509 -in apple-ca/root.pem -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2 | tr -d : | tr a-f A-F)
          echo "root SHA-256: $FP"
          if [ "$FP" = "B0B1730ECBC7FF4505142C49F1295E6EDA6BCAED7E2C68C5BE91B5A11001F024" ]; then
            echo "fingerprint matches Apple's published value"
            HV_CA_PATH=apple-ca build-curltest/curl_tool "https://gs.apple.com/TSS/controller?action=2" --discard 2>&1 | grep -E "TLS_VERIFIED|RC=|VERIFY_FLAGS"
          else
            echo "fingerprint does NOT match; not trusting it"
          fi
          echo "--- the same host with openssl, for comparison"
          echo | openssl s_client -connect gs.apple.com:443 -servername gs.apple.com -showcerts 2>&1 | grep -E "^ *[0-9] s:|^ *i:|a:PKEY|v:NotBefore|Verify return|verify error|Verification" | head -30

      - name: Test the HTTP/TLS client that replaces libcurl on Android (local servers; public check skipped without network)
        run: tools/curl-test.sh build-curltest
      - name: Test idevicerestore's real download.c on the HTTP client (local servers; truncation, redirects, deadline, cancel, >3 MB streaming)
        run: tools/download-test.sh build-dltest
      - name: Build the whole restore stack natively (libplist, libimobiledevice, libtatsu, libirecovery, usbmuxd, idevicerestore, libzip) with a self-test
        run: |
          command -v cmake > /dev/null || sudo apt-get install -y -qq cmake > /dev/null
          tools/restore-selftest-build.sh build-rs
      - name: Run the restore self-test on three bad IPSW inputs (must fail cleanly; usbmuxd must listen; no real network, no real device)
        run: tools/restore-selftest.sh build-rs/restore_selftest build-rs/work
      - name: Test the restore preflight (real restore tool stopped by FLAG_NOACTION against a stand-in ROM and a fake IPSW; deny-mode, boundary and ECID-redaction checks; negative control)
        run: tools/preflight-test.sh build-rs
      - name: "Test G0, the install entry point stopped at stop A (host/install.c + host/install_g0.c with the real session; fake tool; verdict rows for the hook, 217, session report, cleanup, storage identity, write count, cancel, a run that does not end; read-only disk)"
        run: tools/install-g0-test.sh build-rs
      - name: "Test C0 + B0, the screen buffer and its close contract, the key table and the touch-to-mouse loop (plain, ASan+UBSan, TSan; no VM, no Android, no network)"
        run: tools/c0b0-test.sh build-c0
      - name: "Test C1-1, the runner process and the file it shares with the app (plain, ASan+UBSan, TSan; synthetic mode: no VM, no Android, no network): pictures, input, pointer feedback, every stop path, a killed runner, a killed app, dead lock owners; the runner binary is checked for network and VM symbols"
        run: tools/c1-test.sh build-c1
      - name: "Install strace (for the dynamic safety check of the C1-2 runner)"
        run: command -v strace >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq strace)
      - name: "Test C1-2, the runner with the virtual machine in it: Part A (core with a recorder; the runner on a FAKE machine; plain, ASan+UBSan, TSan) and Part B (the runner built against the real engine with a stand-in ROM and blank disks: process test, static safety check, and the same runner under strace with a positive control: no network call, disk and auxiliary storage opened read-only, no other file opened for writing). No guest software runs; no Apple request; not in the APK"
        run: ENGINE_DIR=build-linux EXTRA_LIBS="-lpthread -lm" REQUIRE_STRACE=1 tools/c1vm-test.sh build-c1vm

      - name: "Test B1-a: the graphics device's protocol layer (devices/pvg_lite.c, plain and ASan + UBSan; flat-RAM machine, recording stand-in for the GPU backend)"
        run: |
          bash -n tools/pvg-test.sh
          tools/pvg-test.sh build-pvg

      - name: "Test USB strict control path (host/usb_host.c, devices/virtio_usb.c, host/libusb_shim.c transfers against a FAKE guest/ROM; plain and ASan + UBSan; one process and time limit per scenario). Strict mode is off by default and enabled by no product code. SAFE_BLOCKED is not a recovery; nothing about the real ROM or kernel is shown"
        run: |
          bash -n tools/usb-ctrl-test.sh
          tools/usb-ctrl-test.sh build-usbctrl

      - name: "Test the virtual USB data path under failures (full request ring, dropped response, per-piece deadline, worker that did not start; fake guest; plain and ASan + UBSan)"
        run: |
          bash -n tools/usb-faults-test.sh
          tools/usb-faults-test.sh build-usbfaults

      - name: "Test G2-b: the mock install orchestrator (host/install_plan.c; fake device, fake clock; plain and ASan + UBSan) and its isolation check (no project include, no real names, referenced by nothing but its test). Not connected to any Apple request, device, disk or install path"
        run: |
          bash -n tools/install-plan-test.sh tools/check-install-plan-isolation.sh
          tools/install-plan-test.sh build-ip

      - name: "Test G1, the restore tool's signing path through the install entry point (real session, policy and tool; synthetic TLS server on 127.0.0.1 only; refusals, bad replies, timeouts, bad certificate, redirect, unapproved destination; controls for ticket files, device downloads and an unapproved port; no Apple request)"
        run: tools/install-g1-test.sh build-rs
      - name: "Test the default-deny connection policy (policy table, real glue sockets, curl stand-in, URLAsset decisions, loopback listeners only)"
        run: tools/netguard-test.sh build-rs
      - name: "Test the FDR proxy and the URLAsset step against a fake device, and the restore session rules (policy in force before the tool starts, kept while a thread runs)"
        run: tools/fdr-session-test.sh build-rs
      - name: "Test stop B: per-request TSS failure classification, policy refusal passed on without retry, 1 MiB body cap, test-only loopback, fake TSS server (loopback only, no Apple request)"
        run: tools/tss-stage-test.sh build-tssstage
      - name: "Test the install-disk policy (128 GiB sparse macos_disk.img, kept, never resized, reset only on the exact text, temporary directory)"
        run: tools/disk-policy-test.sh build-diskpolicy
      - name: "Test the G7 safety layer and runner skeleton (read-only preflight, writable-configuration contract, disk+AUX pair, mock writes with out-of-space / partial write / interruption / restart, recorder in place of the machine and the restore; plain and ASan+UBSan; temporary directories only, no Apple request)"
        run: tools/g7-preflight-test.sh build-g7
      - name: "Test the G7 restore adapter and the judgment of its result (fake operations table, no restore tool/machine/network; success only with signal + written disk + GPT + AUX header, everything else keeps the pair in_progress; plain and ASan+UBSan)"
        run: tools/g7-restore-test.sh build-g7restore
      - name: "Test the G7 network allow-list (only the three TSS hosts at 443; wrong port, unregistered, look-alike, redirect hop denied; policy gone after reset until registered again; hook order in install.c; no connection is made)"
        run: tools/g7-net-test.sh build-g7net
      - name: "Test g7_runner (default build: no execution stage; the ECID comes from vm_ecid.txt, not from an option; valid request stops at the switch, refusals, strace: nothing written, no network) and the G7 restore stack check (built WITHOUT any stop switch; no stop hook in the archive; not packaged)"
        run: |
          tools/g7-runner-test.sh build-g7runner
          bash -n tools/check-restore-g7-build.sh tools/restore-g7-build.sh tools/g7-runner-build.sh
          tools/restore-g7-build.sh build-rs-g7
          tools/check-restore-g7-build.sh build-rs-g7
      - name: "Test g7_probe, the G7 request as a program of its own on real files (valid request stops at the switch; refusals, bad arguments, static symbol check, strace: nothing written, no network; native arm64 on this runner; no machine, no restore, no Apple request)"
        run: tools/g7-probe-test.sh build-g7probe

  android-ndk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the Android NDK
        run: |
          curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip -d "$HOME"
          echo "NDK_ROOT=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build the HTTP/TLS test tool for Android (the copy the APK ships)
        run: CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" CURLTOOL_LIBS="" tools/curltool-build.sh build-android-curltool

      - name: Build the engine core and link test_mmu for Android
        run: |
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/engine-build.sh build-android
          file build-android/test_mmu build-android/test_jit
      - name: Build the device models and link test_devices for Android (graphics on a stub)
        continue-on-error: true
        run: CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/devices-build.sh build-android
      - name: Build vmrun with libirecovery for Android (--irecv-probe)
        run: CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/vmrun-irecv-build.sh build-android

      - name: Build vmrun with the TSS probe in it for Android (link only)
        run: |
          command -v cmake > /dev/null || sudo apt-get install -y -qq cmake > /dev/null
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/vmrun-tss-build.sh build-android
      - name: Build the C1-1 runner for Android and check the binary (no network or VM symbols)
        run: CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" NM="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" PF_THREADLIB="" tools/ui-runner-build.sh build-android-runner
      - name: "Build the C1-2 VM runner for Android (NDK compile + link against the Android engine objects, ELF machine / library / forbidden-symbol checks; NOT run, NOT packed into the APK)"
        run: |
          T="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$T/aarch64-linux-android30-clang" NM="$T/llvm-nm" READELF="$T/llvm-readelf" EXTRA_LIBS="-llog" PF_THREADLIB="" tools/ui-runner-vm-build.sh build-android
          "$T/llvm-readelf" -h build-android/ui_runner_vm | grep -E "Class|Machine|Type"
          "$T/llvm-readelf" -d build-android/ui_runner_vm | grep NEEDED
      - name: Build the IPSW downloader for Android (link only; shipped configuration)
        run: CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" CURLTOOL_LIBS="" tools/ipswdl-build.sh build-android-dl
      - name: Build the whole restore stack for Android (integrated link of idevicerestore + usbmuxd + libirecovery + libtatsu + libzip + self-test)
        run: |
          command -v cmake > /dev/null || sudo apt-get install -y -qq cmake > /dev/null
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="" tools/restore-selftest-build.sh build-android-rs
          file build-android-rs/restore_selftest
      - name: "Build the G7 runner for Android: default build (no execution stage, static check) and the EXECUTION build, link only (restore stack WITHOUT stop switches; NOT run, NOT packed into the APK)"
        run: |
          command -v cmake > /dev/null || sudo apt-get install -y -qq cmake > /dev/null
          T="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$T/aarch64-linux-android30-clang" EXTRA_LIBS="" tools/restore-g7-build.sh build-android-rs-g7
          tools/check-restore-g7-build.sh build-android-rs-g7
          CC="$T/aarch64-linux-android30-clang" NM="$T/llvm-nm" READELF="$T/llvm-readelf" tools/g7-runner-build.sh default build-android-g7runner
          CC="$T/aarch64-linux-android30-clang" NM="$T/llvm-nm" READELF="$T/llvm-readelf" EXTRA_LIBS="-llog" PF_THREADLIB="" tools/g7-runner-build.sh real build-android-g7runner build-android build-android-rs-g7
          "$T/llvm-readelf" -h build-android-g7runner/g7_runner_real | grep -E "Class|Machine|Type"
          echo "- g7_runner_real (G7 execution build): linked, not run, not packaged" >> "$GITHUB_STEP_SUMMARY"
      - name: Survey the macOS-restore libraries for Android (compile, then integrated link; informational)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq cmake > /dev/null
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" tools/restore-android-check.sh build-android 2>&1 | tee build-android/restore-survey.txt
      - uses: actions/upload-artifact@v4
        with:
          name: engine-tests-android-arm64
          path: |
            build-android/test_mmu
            build-android/test_jit
            build-android/test_mem
            build-android/test_exc
            build-android/test_devices
            build-android/test_vm
            build-android/vmrun
            build-android/vmrun_irecv
            build-android/romextract
            build-android/restore-survey.txt
