# .github/workflows/android-apk.yml
#
# Builds the Henge JIT probe app (android/) into a debug-signed APK, so the
# split-mapping test can be installed and run on a phone without adb. The app
# compiles host/jit_region.c unchanged and shows the result on screen.
# Runs on pushes to research/android-port that touch the app or the JIT source,
# or by hand. build-henge.yml and android-jit-probe.yml are untouched.

name: Android probe APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - research/android-port
    paths:
      - android/**
      - host/**
      - core/**
      - devices/**
      - tests/**
      - tools/engine-build.sh
      - tools/devices-build.sh
      - .github/workflows/android-apk.yml

env:
  NDK_VERSION: r27c

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android NDK
        run: |
          curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip -d "$HOME"
          echo "NDK_ROOT=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      # The engine tests are built as executables and shipped inside the APK under
      # lib*.so names, so the app can run them as separate processes (no adb).
      - name: Build the engine tests for Android and add them to the APK
        run: |
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/engine-build.sh build-engine
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          for t in mmu jit mem exc; do cp build-engine/test_$t android/app/src/main/jniLibs/arm64-v8a/libtest_$t.so; done
          # Device models (graphics on a stub that draws nothing). A failure here must not stop the APK.
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" EXTRA_LIBS="-llog" tools/devices-build.sh build-engine || echo "::warning::the device or VM tests did not all build; the APK goes with those that did"
          for t in devices vm; do
            if [ -f build-engine/test_$t ]; then cp build-engine/test_$t android/app/src/main/jniLibs/arm64-v8a/libtest_$t.so; fi
          done
          if [ -f build-engine/vmrun ]; then cp build-engine/vmrun android/app/src/main/jniLibs/arm64-v8a/libvmrun.so; fi
          ls -l android/app/src/main/jniLibs/arm64-v8a

      - name: Install SDK platform, build tools and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # The signing key lives in repository secrets, never in the repository.
      # Without ANDROID_KEYSTORE_BASE64 the APK is signed with a temporary key.
      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/probe.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/probe.keystore" >> "$GITHUB_ENV"
            echo "Signing with the fixed key from secrets."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a temporary key (uninstall needed before each update)."
          fi

      - name: Build the debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Show the APK, its native library and signing certificate
        run: |
          ls -l android/app/build/outputs/apk/debug/
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E "lib/|AndroidManifest"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: henge-jit-probe-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
