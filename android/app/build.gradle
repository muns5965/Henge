plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.muns.hengeprobe'
    compileSdk 34

    // CI installs NDK r27c (27.2.12479018) and points NDK_ROOT at it. The
    // version has to match the one at that path.
    ndkVersion '27.2.12479018'
    if (System.getenv('NDK_ROOT')) {
        ndkPath System.getenv('NDK_ROOT')
    }

    defaultConfig {
        applicationId 'dev.muns.hengeprobe'
        minSdk 30          // memfd_create is in bionic from API 30
        targetSdk 34
        // CI's run number, so each build is newer than the one installed and an
        // update over the old APK is accepted.
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '0.2+' + (System.getenv('GITHUB_SHA') ?: 'local').take(7)
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // A fixed key lets a new APK install over the old one. CI supplies it from
    // repository secrets (KEYSTORE_FILE and the three values below). Without
    // them the build falls back to the temporary debug key, which changes on
    // every run and forces an uninstall first.
    signingConfigs {
        probe {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.probe
            }
        }
    }
}
