plugins {
    id 'com.android.application'
}

def hengeVersionCode() {
    def v = System.getenv('HENGE_VERSION_CODE')
    if (v) return Integer.parseInt(v)
    if (System.getenv('GITHUB_ACTIONS')) throw new GradleException('HENGE_VERSION_CODE is not set in CI (tools/ci-version-code.sh)')
    return 1
}

android {
    namespace 'dev.muns.hengeprobe'
    compileSdk 34

    // CI installs NDK r27c (27.2.12479018) and points NDK_ROOT at it. The
    // version has to match the one at that path.
    ndkVersion '27.2.12479018'
    if (System.getenv('NDK_ROOT')) {
        ndkPath System.getenv('NDK_ROOT')
    }

    defaultConfig {
        applicationId 'dev.muns.hengeprobe'
        minSdk 30          // memfd_create is in bionic from API 30
        targetSdk 34
        // CI passes HENGE_VERSION_CODE from tools/ci-version-code.sh (commit time, seconds since 2026-01-01 UTC), the SAME rule in the general APK and the G7 execution APK workflows: the same commit gives the same code in both, a newer commit a higher one,
        // so an update over the installed app is accepted whichever workflow finishes first. (The run number is per workflow and cannot be compared across them.) A CI build without it fails instead of falling back.
        // Local builds keep 1.
        versionCode hengeVersionCode()
        versionName '0.2+' + (System.getenv('GITHUB_SHA') ?: 'local').take(7)
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // A fixed key lets a new APK install over the old one. CI supplies it from
    // repository secrets (KEYSTORE_FILE and the three values below). Without
    // them the build falls back to the temporary debug key, which changes on
    // every run and forces an uninstall first.
    signingConfigs {
        probe {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.probe
            }
        }
        // The G7 EXECUTION build (assembleG7exec): same package and key as the general app, so it installs over it and keeps its private files (ROM, ECID, IPSW). Its own
        // source set src/g7exec holds the only launcher of the execution binary and the binary itself; assembleDebug never includes it (tools/check-g7exec-apk.sh checks both APKs).
        g7exec {
            initWith debug
            matchingFallbacks = ['debug']
        }
    }
}
